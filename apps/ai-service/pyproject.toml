[project]
name = "acme-ai-service"
version = "0.1.0"
description = "FastAPI + LangChain AI service for the Acme platform."
# readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-jose[cryptography]>=3.3",
  "langchain>=0.3",
  "langchain-openai>=0.2",
  "langchain-anthropic>=0.2",
  "langchain-community>=0.3",
  "langgraph>=0.2",
  "openai>=1.40",
  "httpx>=0.27",
  # Video agent
  "motor>=3.6",                         # async MongoDB
  "azure-storage-blob>=12.20",          # video + thumbnail upload
  "edge-tts>=7.3.1",                    # free TTS (Microsoft); the service 403s old clients, keep this current
  "moviepy==1.0.3",                     # editor node
  "imageio-ffmpeg>=0.5",                # ships an ffmpeg binary
  "Pillow>=10",
  "requests>=2.31",
  "replicate>=0.30",                    # AI imagery (Flux Schnell)
  "tavily-python>=0.5",                 # research
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
